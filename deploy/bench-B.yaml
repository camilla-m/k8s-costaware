# BENCH ARM B -- baseline FORTE: bin-packing nativo (MostAllocated).
# Consolida, mas e CEGO A PRECO: empacota por razao de recurso, nao por
# $/recurso. E contra este arm que Phi precisa ganhar.
#
# Scheduler separado, subido por bench/run_local.py. clientConnection.kubeconfig
# e injetado em tempo de execucao.
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
leaderElection:
  leaderElect: false
profiles:
  - schedulerName: bench-b
    pluginConfig:
      - name: NodeResourcesFit
        args:
          scoringStrategy:
            type: MostAllocated
            resources:
              - name: cpu
                weight: 1
              - name: memory
                weight: 1
    plugins:
      score:
        enabled:
          - name: NodeResourcesFit
            weight: 5
        disabled:
          - name: NodeResourcesBalancedAllocation
